<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Action Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: summary strip on top, add form card, then a responsive grid of owner cards */
:root {
  --bg: #eceff0;
  --surface: #ffffff;
  --ink: #1d2327;
  --muted: #646e76;
  --line: #d9dee1;
  --accent: #e2650f;
  --accent-soft: #fbeadc;
  --danger: #c0352b;
  --danger-soft: #fbe6e3;
  --done: #8a949b;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 30, 36, 0.05), 0 4px 16px rgba(20, 30, 36, 0.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a1c;
    --surface: #1f2427;
    --ink: #e8ecee;
    --muted: #9aa4ab;
    --line: #313a3f;
    --accent: #f27a2a;
    --accent-soft: #3a2618;
    --danger: #f0675b;
    --danger-soft: #3b1f1c;
    --done: #6d777e;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a1c;
  --surface: #1f2427;
  --ink: #e8ecee;
  --muted: #9aa4ab;
  --line: #313a3f;
  --accent: #f27a2a;
  --accent-soft: #3a2618;
  --danger: #f0675b;
  --danger-soft: #3b1f1c;
  --done: #6d777e;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  display: grid;
  gap: 28px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }

/* Header */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}
header h1 { font-size: 34px; font-weight: 700; line-height: 1.15; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
.today { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

/* Summary */
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.stat {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: 18px 22px;
  display: grid;
  gap: 2px;
}
.stat .num {
  font-family: var(--font-display);
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat .label { color: var(--muted); font-size: 16px; }
.stat.open .num { color: var(--accent); }
.stat.overdue { border-left: 5px solid var(--danger); }
.stat.overdue .num { color: var(--danger); }
.stat.overdue.zero { border-left-color: var(--line); }
.stat.overdue.zero .num { color: var(--ink); }

/* Add form */
.add {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  display: grid;
  gap: 14px;
}
.add h2 { font-size: 20px; }
.fields {
  display: grid;
  grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.2fr) minmax(0, 1fr) auto;
  gap: 12px;
  align-items: end;
}
.field { display: grid; gap: 6px; }
.field label { font-size: 15px; color: var(--muted); font-weight: 700; }
input[type="text"], input[type="date"] {
  font: inherit;
  font-size: 18px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  width: 100%;
  min-height: 50px;
}
input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  font: inherit;
  font-weight: 700;
  font-size: 18px;
  border: 0;
  border-radius: 10px;
  padding: 12px 22px;
  min-height: 50px;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  font-size: 16px;
  min-height: 42px;
  padding: 8px 16px;
}
.btn.ghost:hover { background: var(--bg); filter: none; }
.form-error { color: var(--danger); font-size: 16px; min-height: 0; margin: 0; }
.form-error:empty { display: none; }

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.toolbar h2 { font-size: 22px; }
.toolbar .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Owner cards */
.owners {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 18px;
  align-items: start;
}
.owner {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.owner-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.avatar {
  width: 40px; height: 40px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
}
.owner-meta { flex: 1; min-width: 0; display: grid; gap: 6px; }
.owner-head h3 { font-size: 21px; line-height: 1.2; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 14px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chip.red { background: var(--danger-soft); color: var(--danger); }

ul.items { list-style: none; margin: 0; padding: 6px 0; }
.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: start;
  padding: 12px 20px;
  border-left: 4px solid transparent;
}
.item + .item { border-top: 1px solid var(--line); }
.item.is-overdue { border-left-color: var(--danger); background: var(--danger-soft); }
.item input[type="checkbox"] {
  width: 26px; height: 26px;
  margin: 2px 0 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.item .text { font-size: 19px; overflow-wrap: anywhere; }
.item .due {
  font-size: 15px;
  color: var(--muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.item.is-overdue .text, .item.is-overdue .due { color: var(--danger); }
.item.is-overdue .due { font-weight: 700; }
.item.is-today .due { color: var(--accent); font-weight: 700; }
.item.is-done .text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.item.is-done .due { color: var(--done); }
.del {
  font: inherit;
  font-size: 22px;
  line-height: 1;
  background: none;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  opacity: 0.55;
}
.del:hover { opacity: 1; background: var(--bg); }
.owner-empty { padding: 14px 20px; color: var(--muted); font-size: 16px; }

.empty {
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  padding: 40px 24px;
  text-align: center;
  color: var(--muted);
}
.notice {
  font-size: 15px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.notice:empty { display: none; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 14px 12px 20px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  max-width: calc(100% - 32px);
}
.toast[hidden] { display: none; }
.toast button {
  font: inherit;
  font-weight: 700;
  background: none;
  border: 0;
  color: var(--accent);
  cursor: pointer;
  padding: 6px 8px;
}

@media (max-width: 820px) {
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .field:first-child { grid-column: 1 / -1; }
  .fields .btn { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  body { font-size: 17px; }
  .wrap { padding: 28px 16px 80px; gap: 22px; }
  header h1 { font-size: 28px; }
  .summary { gap: 10px; }
  .stat { padding: 14px; }
  .stat .num { font-size: 32px; }
  .stat .label { font-size: 14px; }
  .fields { grid-template-columns: 1fr; }
  .owners { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .item, .stat .num { transition: background-color .2s ease, color .2s ease; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>Meeting Action Tracker</h1>
      <p>Every agreed action, who owns it, and when it is due.</p>
    </div>
    <div class="today" id="today"></div>
  </header>

  <section class="summary" aria-label="Summary">
    <div class="stat open"><span class="num" id="countOpen">0</span><span class="label">Open</span></div>
    <div class="stat done"><span class="num" id="countDone">0</span><span class="label">Done</span></div>
    <div class="stat overdue" id="overdueTile"><span class="num" id="countOverdue">0</span><span class="label">Overdue</span></div>
  </section>

  <form class="add" id="addForm" novalidate>
    <h2>Add an action</h2>
    <div class="fields">
      <div class="field">
        <label for="fText">Action</label>
        <input type="text" id="fText" placeholder="e.g. Send revised rota to store managers" autocomplete="off">
      </div>
      <div class="field">
        <label for="fOwner">Owner</label>
        <input type="text" id="fOwner" list="ownerList" placeholder="Name" autocomplete="off">
        <datalist id="ownerList"></datalist>
      </div>
      <div class="field">
        <label for="fDue">Due date</label>
        <input type="date" id="fDue">
      </div>
      <button class="btn" type="submit" id="addBtn">Add action</button>
    </div>
    <p class="form-error" id="formError" role="alert"></p>
  </form>

  <section>
    <div class="toolbar">
      <h2>By owner</h2>
      <div class="actions">
        <label class="toggle" for="hideDone"><input type="checkbox" id="hideDone"> Hide done</label>
        <button class="btn ghost" type="button" id="copyBtn">Copy open actions</button>
      </div>
    </div>
  </section>

  <div class="notice" id="notice"></div>
  <section class="owners" id="owners" aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" hidden>Undo</button>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "meeting-action-tracker.v1";
  var SEEN_KEY = "meeting-action-tracker.seeded";
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var state = { actions: [], hideDone: false };
  var storageOk = true;
  var lastDeleted = null;
  var toastTimer = null;

  // ---------- dates ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function isoLocal(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayIso() { return isoLocal(new Date()); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return isoLocal(d); }
  function fmtDate(iso) {
    if (!iso) return "No due date";
    var p = iso.split("-");
    return parseInt(p[2], 10) + " " + MONTHS[parseInt(p[1], 10) - 1] + " " + p[0];
  }
  function daysBetween(fromIso, toIso) {
    var a = fromIso.split("-"), b = toIso.split("-");
    var da = Date.UTC(+a[0], +a[1] - 1, +a[2]);
    var db = Date.UTC(+b[0], +b[1] - 1, +b[2]);
    return Math.round((db - da) / 86400000);
  }
  function statusOf(a, today) {
    if (a.done) return "done";
    if (!a.due) return "open";
    if (a.due < today) return "overdue";
    if (a.due === today) return "today";
    return "open";
  }
  function dueLabel(a, today) {
    if (a.done) return "Done" + (a.doneAt ? " on " + fmtDate(a.doneAt) : "");
    if (!a.due) return "No due date";
    var diff = daysBetween(today, a.due);
    if (diff < 0) return (-diff) + (diff === -1 ? " day" : " days") + " overdue, due " + fmtDate(a.due);
    if (diff === 0) return "Due today";
    if (diff === 1) return "Due tomorrow, " + fmtDate(a.due);
    return "Due " + fmtDate(a.due);
  }

  // ---------- storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.actions = Array.isArray(parsed.actions) ? parsed.actions : [];
        state.hideDone = !!parsed.hideDone;
        return;
      }
      if (!localStorage.getItem(SEEN_KEY)) {
        state.actions = examples();
        localStorage.setItem(SEEN_KEY, "1");
        save();
      }
    } catch (e) {
      storageOk = false;
      state.actions = examples();
    }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ actions: state.actions, hideDone: state.hideDone }));
    } catch (e) {
      storageOk = false;
    }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function examples() {
    var t = todayIso();
    return [
      { text: "Confirm December weekend rota with store managers", owner: "Priya", due: addDays(-3) },
      { text: "Share stock-take variance report", owner: "Priya", due: addDays(2) },
      { text: "Book pest control for Tampines outlet", owner: "Marcus", due: addDays(-1) },
      { text: "Update POS price tags for year-end sale", owner: "Marcus", due: t },
      { text: "Send new-hire onboarding pack", owner: "Marcus", due: addDays(-5), done: true },
      { text: "Collect Q4 shrinkage figures from all outlets", owner: "Wei Ling", due: addDays(6) },
      { text: "Draft festive staffing budget", owner: "Wei Ling", due: addDays(1) }
    ].map(function (a) {
      return { id: uid(), text: a.text, owner: a.owner, due: a.due, done: !!a.done,
               doneAt: a.done ? addDays(-4) : null, createdAt: t, example: true };
    });
  }

  // ---------- render ----------
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initials(name) {
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || "")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function rank(s) { return { overdue: 0, today: 1, open: 2, done: 3 }[s]; }

  function render() {
    var today = todayIso();
    $("today").textContent = "Today: " + fmtDate(today);

    var open = 0, done = 0, overdue = 0;
    var groups = {};
    state.actions.forEach(function (a) {
      var s = statusOf(a, today);
      if (s === "done") done++; else open++;
      if (s === "overdue") overdue++;
      var key = a.owner.trim().toLowerCase();
      if (!groups[key]) groups[key] = { name: a.owner.trim(), items: [], open: 0, overdue: 0, done: 0 };
      groups[key].items.push({ a: a, s: s });
      if (s === "done") groups[key].done++; else groups[key].open++;
      if (s === "overdue") groups[key].overdue++;
    });

    $("countOpen").textContent = open;
    $("countDone").textContent = done;
    $("countOverdue").textContent = overdue;
    $("overdueTile").classList.toggle("zero", overdue === 0);

    // owner suggestions
    var names = Object.keys(groups).map(function (k) { return groups[k].name; }).sort();
    $("ownerList").innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("");

    // notice
    var hasExamples = state.actions.some(function (a) { return a.example; });
    var notes = [];
    if (hasExamples) notes.push('<span>Showing example actions so you can see how it works.</span><button class="btn ghost" type="button" id="clearExamples">Remove examples</button>');
    if (!storageOk) notes.push("<span>This browser is blocking local storage, so actions will be lost when you close the page.</span>");
    $("notice").innerHTML = notes.join("");
    var ce = $("clearExamples");
    if (ce) ce.addEventListener("click", clearExamples);

    // owners
    var list = Object.keys(groups).map(function (k) { return groups[k]; });
    list.sort(function (x, y) {
      if (y.overdue !== x.overdue) return y.overdue - x.overdue;
      if ((y.open > 0) !== (x.open > 0)) return (y.open > 0) - (x.open > 0);
      return x.name.localeCompare(y.name);
    });

    if (!list.length) {
      $("owners").innerHTML = '<div class="empty" style="grid-column:1/-1">No actions yet. Add the first one agreed in your meeting above.</div>';
      return;
    }

    $("owners").innerHTML = list.map(function (g) {
      var items = g.items.slice().sort(function (p, q) {
        var r = rank(p.s) - rank(q.s);
        if (r) return r;
        return (p.a.due || "9999").localeCompare(q.a.due || "9999");
      });
      var visible = state.hideDone ? items.filter(function (i) { return i.s !== "done"; }) : items;

      var chips = '<span class="chip">' + g.open + " open</span>";
      if (g.overdue) chips = '<span class="chip red">' + g.overdue + " overdue</span>" + chips;
      if (g.done) chips += '<span class="chip">' + g.done + " done</span>";

      var body = visible.length
        ? '<ul class="items">' + visible.map(function (i) {
            var a = i.a, cls = "item is-" + i.s;
            var cid = "cb-" + a.id;
            return '<li class="' + cls + '" data-id="' + a.id + '">' +
              '<input type="checkbox" id="' + cid + '"' + (a.done ? " checked" : "") + ' aria-label="Mark done: ' + esc(a.text) + '">' +
              '<label for="' + cid + '"><div class="text">' + esc(a.text) + '</div>' +
              '<div class="due">' + esc(dueLabel(a, today)) + '</div></label>' +
              '<button class="del" type="button" aria-label="Delete action: ' + esc(a.text) + '" title="Delete">&times;</button>' +
            "</li>";
          }).join("") + "</ul>"
        : '<div class="owner-empty">All done. Nothing open for ' + esc(g.name) + ".</div>";

      return '<article class="owner">' +
        '<div class="owner-head"><span class="avatar" aria-hidden="true">' + esc(initials(g.name)) + "</span>" +
        '<div class="owner-meta"><h3>' + esc(g.name) + '</h3><div class="chips">' + chips + "</div></div></div>" + body + "</article>";
    }).join("");
  }

  // ---------- actions ----------
  function addAction(e) {
    e.preventDefault();
    var text = $("fText").value.trim();
    var owner = $("fOwner").value.trim().replace(/\s+/g, " ");
    var due = $("fDue").value;
    var missing = [];
    [["fText", text, "action"], ["fOwner", owner, "owner"], ["fDue", due, "due date"]].forEach(function (f) {
      $(f[0]).setAttribute("aria-invalid", f[1] ? "false" : "true");
      if (!f[1]) missing.push(f[2]);
    });
    if (missing.length) {
      $("formError").textContent = "Please add the " + missing.join(", ").replace(/, ([^,]*)$/, " and $1") + ".";
      $(missing[0] === "action" ? "fText" : missing[0] === "owner" ? "fOwner" : "fDue").focus();
      return;
    }
    // match an existing owner's spelling, case-insensitively
    var existing = state.actions.find(function (a) { return a.owner.trim().toLowerCase() === owner.toLowerCase(); });
    if (existing) owner = existing.owner.trim();

    state.actions.push({ id: uid(), text: text, owner: owner, due: due, done: false, doneAt: null, createdAt: todayIso() });
    save();
    $("formError").textContent = "";
    $("fText").value = "";
    $("fText").focus();
    render();
    showToast("Added for " + owner + ", due " + fmtDate(due) + ".");
  }

  function onListClick(e) {
    var li = e.target.closest(".item");
    if (!li) return;
    var id = li.getAttribute("data-id");
    var idx = state.actions.findIndex(function (a) { return a.id === id; });
    if (idx < 0) return;

    if (e.target.matches('input[type="checkbox"]')) {
      var a = state.actions[idx];
      a.done = e.target.checked;
      a.doneAt = a.done ? todayIso() : null;
      save();
      render();
      var cb = document.getElementById("cb-" + id);
      if (cb) cb.focus();
    } else if (e.target.closest(".del")) {
      lastDeleted = { item: state.actions[idx], index: idx };
      state.actions.splice(idx, 1);
      save();
      render();
      showToast("Action deleted.", true);
    }
  }

  function undoDelete() {
    if (!lastDeleted) return;
    state.actions.splice(lastDeleted.index, 0, lastDeleted.item);
    lastDeleted = null;
    save();
    render();
    hideToast();
  }

  function clearExamples() {
    state.actions = state.actions.filter(function (a) { return !a.example; });
    save();
    render();
    showToast("Examples removed. Add your first real action above.");
    $("fText").focus();
  }

  function copyOpen() {
    var today = todayIso();
    var groups = {};
    state.actions.forEach(function (a) {
      if (a.done) return;
      var k = a.owner.trim();
      (groups[k] = groups[k] || []).push(a);
    });
    var owners = Object.keys(groups).sort();
    if (!owners.length) { showToast("Nothing open to copy."); return; }
    var lines = ["Open actions as of " + fmtDate(today), ""];
    owners.forEach(function (o) {
      lines.push(o);
      groups[o].sort(function (x, y) { return (x.due || "9999").localeCompare(y.due || "9999"); })
        .forEach(function (a) {
          var flag = a.due && a.due < today ? " [OVERDUE]" : "";
          lines.push("- " + a.text + " (due " + fmtDate(a.due) + ")" + flag);
        });
      lines.push("");
    });
    var text = lines.join("\n").trim();
    try {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Copied. Paste it into your team chat or meeting notes.");
      }, function () { showToast("Copy was blocked by the browser. Try again from a regular tab."); });
    } catch (err) {
      showToast("Copy is not available in this browser.");
    }
  }

  function showToast(msg, withUndo) {
    $("toastMsg").textContent = msg;
    $("toastUndo").hidden = !withUndo;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, withUndo ? 6000 : 3000);
  }
  function hideToast() { $("toast").hidden = true; }

  // ---------- init ----------
  load();
  $("hideDone").checked = state.hideDone;
  $("fDue").value = addDays(7);
  $("addForm").addEventListener("submit", addAction);
  $("owners").addEventListener("change", onListClick);
  $("owners").addEventListener("click", function (e) { if (e.target.closest(".del")) onListClick(e); });
  $("hideDone").addEventListener("change", function () { state.hideDone = this.checked; save(); render(); });
  $("copyBtn").addEventListener("click", copyOpen);
  $("toastUndo").addEventListener("click", undoDelete);
  ["fText", "fOwner", "fDue"].forEach(function (id) {
    $(id).addEventListener("input", function () { this.setAttribute("aria-invalid", "false"); });
  });
  // roll overdue status over at midnight if the tab stays open
  setInterval(render, 60000);
  render();
})();
</script>
</body>
</html>
